name: Question Bank Service CI/CD

on:
  push:
    branches:
      - QB-service
    paths:
      - '**'  # Set to trigger on ANY file change so we guarantee it fires
  pull_request:
    branches:
      - QB-service
    paths:
      - '**'

jobs:
  build-and-test:
    name: Build, Test, and Sonar Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' 

      - name: Install Dependencies
        # Removed working-directory; running from the root
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx moto 

      - name: Run Pytest and Generate Coverage Report
        env:
          TABLE_NAME: "QuestionBankTable_SW_Test"
        run: |
          PYTHONPATH=. pytest tests/ --cov=question_bank_service --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   
        with:
          projectBaseDir: .  # Scanning from the root

      # --- SNYK STEPS ---
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --file=requirements.txt --severity-threshold=high
          snyk monitor --file=requirements.txt

  deploy:
    name: Deploy Code Update to AWS
    needs: build-and-test
    if: github.ref == 'refs/heads/QB-service' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Package Question Bank Service Lambda
        run: |
          pip install --target ./package -r requirements.txt
          cd package
          zip -r ../payload.zip .
          cd ..
          zip -g payload.zip -r question_bank_service/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-1

      - name: Update Lambda Code via AWS CLI
        run: |
          # The payload.zip is now correctly built at the root
          aws lambda update-function-code \
            --function-name QuestionBankService_SW \
            --zip-file fileb://payload.zip

      - name: Wait for Lambda Code Update to Complete
        run: |
          aws lambda wait function-updated \
            --function-name QuestionBankService_SW

      - name: Update Lambda Environment Variables
        run: |
          aws lambda update-function-configuration \
            --function-name QuestionBankService_SW \
            --environment "Variables={TABLE_NAME=QuestionBankTable_SW}"